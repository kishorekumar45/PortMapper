[project]
name = "portmapper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
    "typer",
]

[project.scripts]
portmapper = "portmapper.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["portmapper*"]
